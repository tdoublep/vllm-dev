apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpa-dev
  labels:
    app: tpa-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: tpa-dev
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tpa-dev
    spec:
      containers:
      - name: vllm-dev
        image: quay.io/tdoublep/vllm-dev:latest
        # command: ["sleep", "infinity"]
        env:
        # env vars here will apply to all environments
        resources:
          limits:
            cpu: "16"
            memory: 96Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "8"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

      priorityClassName: system-node-critical
      restartPolicy: Always
